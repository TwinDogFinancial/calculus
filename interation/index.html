<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Integration Examples</title>
    <!-- MathJax for rendering LaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        #list {
            width: 30%;
            background: #f4f4f4;
            overflow-y: auto;
            padding: 1rem;
            box-sizing: border-box;
        }
        #list .example-item {
            padding: 0.5rem;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }
        #list .example-item.active {
            background: #d0eaff;
        }
        #display {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        .formula {
            margin-top: 1rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="list"></div>
    <div id="display">
        <h2>Integration Examples</h2>
        <p>Select an example from the list to see the integral and its solution.</p>
    </div>

    <script src="../integration/integration.js"></script>
</body>
</html>
