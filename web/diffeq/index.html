<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Differential Equations</title>
    <!-- MathJax for LaTeX rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <!-- Chart.js for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2rem;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
        }

        #example-list {
            margin-bottom: 1.5rem;
        }

        .example-item {
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
        }

        .example-item:hover {
            background-color: #f0f0f0;
        }

        .example-item.active {
            background-color: #d0eaff;
        }

        #display {
            border-top: 1px solid #ccc;
            padding-top: 1rem;
        }

        .formula {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }

        #graph-container {
            margin-top: 2rem;
            max-width: 800px;
        }

        canvas {
            width: 100% !important;
            height: 400px !important;
        }
    </style>
</head>

<body>
    <h1>Differential Equations</h1>

    <div id="example-list">
        <strong>Select an example:</strong>
        <ul id="list"></ul>
    </div>

    <div id="display">
        <div class="formula" id="ode"></div>
        <div class="formula" id="solution"></div>
        <p id="description"></p>

        <div id="graph-container">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>

    <script src="diffeq.js"></script>
</body>

</html>
