<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Scientific Graphing Calculator</title>
    <!-- MathJax for rendering LaTeX (optional, for displaying formulas) -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <!-- Math.js for parsing / evaluating / differentiating expressions -->
    <script src="https://cdn.jsdelivr.net/npm/mathjs/lib/browser/math.js"></script>
    <!-- Chart.js for drawing the graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2rem;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
        }

        .controls {
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            justify-content: center;
        }

        .controls input,
        .controls select,
        .controls button {
            padding: 0.4rem 0.6rem;
            font-size: 1rem;
        }

        #graphContainer {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        #graphCanvas {
            width: 100%;
            height: 500px;
        }

        .formula {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <h1>Scientific Graphing Calculator</h1>

    <div class="controls">
        <label for="exprInput">f(x) = </label>
        <input type="text" id="exprInput" placeholder="e.g. sin(x) + x^2" size="30">
        <label for="operationSelect">Operation:</label>
        <select id="operationSelect">
            <option value="function">Plot Function</option>
            <option value="derivative">Plot Derivative</option>
            <option value="integral">Plot Integral (numerical)</option>
        </select>
        <button id="plotBtn">Plot</button>
    </div>

    <div class="formula" id="displayFormula"></div>

    <div id="graphContainer">
        <canvas id="graphCanvas"></canvas>
    </div>

    <script src="calculator.js"></script>
</body>

</html>
